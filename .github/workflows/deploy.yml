name: Deploy frontend

# Builds the Astro frontend, syncs the static output to the site's S3 bucket,
# and triggers a full CloudFront invalidation.
#
# Auth: IAM user access keys (temporary). OIDC role assumption kept failing
# authorization despite a verified-matching trust policy; switched to keys on
# 2026-07-21 to unblock, with the intent to return to OIDC in a later session.
# The IAM user + access keys are a prerequisite NOT created by the Stage 1 CDK
# stack — configure them before the first real run.
#
# STAGE 2 GATE: automatic deploy on push to `main` was authorized by the
# developer on 2026-07-21 (see infra/spec.md, Stage 2 STOP).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: S3 sync runs with --dryrun and CloudFront invalidation is skipped."
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

# Never run two deploys against the same environment at once.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

# Least privilege: repo checkout only.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve dry-run flag
        id: mode
        # workflow_dispatch honors the input; any future push trigger deploys for real.
        run: echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build output to S3
        # Two passes so hashed/immutable assets and HTML entry points get
        # different Cache-Control (see infra/spec.md Decisions Log). --delete
        # only removes destination objects matching each pass's own filter,
        # so together the two passes still clean up every removed file.
        # NOTE: if the Astro build ever adds a new top-level asset directory
        # besides _astro/ and fonts/, it falls through to the second pass
        # (no-cache) unless a matching CloudFront behavior + sync filter is
        # added for it too — see infra/lib/constants.ts ASSET_BEHAVIORS.
        run: |
          aws s3 sync frontend/dist "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --exclude "*" --include "_astro/*" --include "fonts/*" \
            --cache-control "public, max-age=31536000, immutable" \
            ${{ steps.mode.outputs.dry_run == 'true' && '--dryrun' || '' }}

          aws s3 sync frontend/dist "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache" \
            ${{ steps.mode.outputs.dry_run == 'true' && '--dryrun' || '' }}

      - name: Invalidate CloudFront distribution
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Summary
        run: |
          {
            echo "### Deploy frontend"
            echo ""
            echo "- Mode: ${{ steps.mode.outputs.dry_run == 'true' && 'DRY RUN (no changes applied)' || 'LIVE deploy' }}"
            echo "- Bucket: \`${{ secrets.S3_BUCKET_NAME }}\`"
            echo "- Distribution: \`${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
